<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Торговая платформа - Прототип</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #121826; color: #fff; }
        header { background-color: #1a2233; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #00b0ff; }
        .nav-links a { color: #fff; text-decoration: none; margin-left: 20px; }
        .main-container { display: flex; height: calc(100vh - 60px); padding: 20px; box-sizing: border-box; }
        .chart-section { flex: 3; background-color: #1a2233; margin-right: 20px; border-radius: 8px; padding: 20px; }
        .trading-panel { flex: 1; background-color: #1a2233; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; }
        .btn { background-color: #00b0ff; color: #fff; border: none; padding: 12px; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-sell { background-color: #ff5252; }
    </style>
</head>
<body>

<header>
    <div class="logo">CryptoTrade</div>
    <div class="nav-links">
        <a href="#">Баланс: $1000</a>
        <a href="#">Выход</a>
    </div>
</header>

<div class="main-container">
    <div class="chart-section">
        <h2>Живой график котировок</h2>
        <div style="height: 300px; background-color: #25334a; display: flex; align-items: center; justify-content: center; color: #8899a6;">
            Здесь будет график
        </div>
    </div>
    <div class="trading-panel">
        <h2>Панель управления</h2>
        <div style="margin-bottom: 20px;">
            <label>Сумма:</label>
            <input type="number" value="10" style="padding: 10px; width: 100%; box-sizing: border-box; margin-top: 5px;">
        </div>
        <button class="btn">Купить (CALL)</button>
        <button class="btn btn-sell">Продать (PUT)</button>
    </div>
</div>

</body>
</html>
