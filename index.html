<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Торговая платформа - Прототип</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .chart-container {
            position: relative;
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">CryptoTrade</div>
    <div class="nav-links">
        <a href="#">Баланс: $1000</a>
        <a href="#">Выход</a>
    </div>
</header>

<div class="main-container">
    <div class="chart-section">
        <h2>Живой график котировок</h2>
        <div class="chart-container">
            <canvas id="tradingChart"></canvas>
        </div>
    </div>
    <div class="trading-panel">
        <h2>Панель управления</h2>
        <div class="input-group">
            <label>Сумма:</label>
            <input type="number" value="10">
        </div>
        <button class="btn btn-buy">Купить (CALL)</button>
        <button class="btn btn-sell">Продать (PUT)</button>
    </div>
</div>

<script>
    const ctx = document.getElementById('tradingChart').getContext('2d');
    const tradingChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['12:00', '12:05', '12:10', '12:15', '12:20'],
            datasets: [{
                label: 'Цена актива',
                data: [120, 122, 121, 125, 124],
                borderColor: '#00b0ff',
                backgroundColor: 'rgba(0, 176, 255, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: false,
                    grid: {
                        color: 'rgba(255, 255, 255, 0.1)'
                    }
                },
                x: {
                    grid: {
                        color: 'rgba(255, 255, 255, 0.1)'
                    }
                }
            }
        }
    });

    setInterval(() => {
        const now = new Date();
        const timeString = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
        const lastData = tradingChart.data.datasets[0].data[tradingChart.data.datasets[0].data.length - 1];
        const newData = lastData + (Math.random() - 0.5) * 2;

        tradingChart.data.labels.push(timeString);
        tradingChart.data.datasets[0].data.push(newData.toFixed(2));

        if (tradingChart.data.labels.length > 20) {
            tradingChart.data.labels.shift();
            tradingChart.data.datasets[0].data.shift();
        }

        tradingChart.update();
    }, 1000);
</script>

</body>
</html>
